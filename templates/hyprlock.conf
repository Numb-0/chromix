# Generated by chromix from a matugen template. Changes are lost on the
# next theme switch.

# Colours for your own widgets, e.g. `color = $m3primaryFixed`. Text
# drawn over the wallpaper wants a fixed role: those keep one tone in
# both modes, like the wallpaper does, where on_*_container roles only
# read against their container.
$m3primary = rgb({{colors.primary.default.hex_stripped}})
$m3primaryFixed = rgb({{colors.primary_fixed.default.hex_stripped}})
$m3secondary = rgb({{colors.secondary.default.hex_stripped}})
$m3secondaryFixed = rgb({{colors.secondary_fixed.default.hex_stripped}})
$m3tertiary = rgb({{colors.tertiary.default.hex_stripped}})
$m3tertiaryFixed = rgb({{colors.tertiary_fixed.default.hex_stripped}})
$m3surface = rgb({{colors.surface.default.hex_stripped}})
$m3surfaceContainer = rgb({{colors.surface_container.default.hex_stripped}})
$m3onSurface = rgb({{colors.on_surface.default.hex_stripped}})
$m3outline = rgb({{colors.outline.default.hex_stripped}})
$m3error = rgb({{colors.error.default.hex_stripped}})
$m3red = rgb({{colors.red.default.hex_stripped}})
$m3green = rgb({{colors.green.default.hex_stripped}})
$m3yellow = rgb({{colors.yellow.default.hex_stripped}})
$m3magenta = rgb({{colors.magenta.default.hex_stripped}})
$m3success = rgb({{colors.success.default.hex_stripped}})
$m3warning = rgb({{colors.warning.default.hex_stripped}})

# The image the theme came from, for `background { path = $wallpaper }`.
$wallpaper = {{image}}
