# Generated by chromix from a matugen template. Changes are lost on the
# next theme switch.

# A yazi flavor: yazi lays it over its preset and under theme.toml, so
# anything set there still wins. Icons keep the preset's own colours.
# Previews without a tmtheme.xml fall back to the terminal's ANSI
# colours, which the kitty target already themes.

[app]
overall = {}

[mgr]
cwd = { fg = "{{colors.tertiary.default.hex}}" }

find_keyword  = { fg = "{{colors.yellow.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.magenta.default.hex}}", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "{{colors.outline.default.hex}}", italic = true }

marker_copied   = { fg = "{{colors.green.default.hex}}", bg = "{{colors.green.default.hex}}" }
marker_cut      = { fg = "{{colors.red.default.hex}}", bg = "{{colors.red.default.hex}}" }
marker_marked   = { fg = "{{colors.cyan.default.hex}}", bg = "{{colors.cyan.default.hex}}" }
marker_selected = { fg = "{{colors.yellow.default.hex}}", bg = "{{colors.yellow.default.hex}}" }

count_copied   = { fg = "{{colors.on_green.default.hex}}", bg = "{{colors.green.default.hex}}" }
count_cut      = { fg = "{{colors.on_red.default.hex}}", bg = "{{colors.red.default.hex}}" }
count_selected = { fg = "{{colors.on_yellow.default.hex}}", bg = "{{colors.yellow.default.hex}}" }

border_style = { fg = "{{colors.outline_variant.default.hex}}" }

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

# Normal is the seed's primary; select and unset, which change what a
# key does, stand out in the secondary and the error roles.
[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
select_main = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
unset_main  = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" }

[indicator]
parent  = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
current = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
preview = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

[status]
perm_sep   = { fg = "{{colors.outline.default.hex}}" }
perm_type  = { fg = "{{colors.green.default.hex}}" }
perm_read  = { fg = "{{colors.yellow.default.hex}}" }
perm_write = { fg = "{{colors.red.default.hex}}" }
perm_exec  = { fg = "{{colors.cyan.default.hex}}" }

progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

[which]
border          = { fg = "{{colors.primary.default.hex}}" }
mask            = { bg = "{{colors.surface_container.default.hex}}" }
cand            = { fg = "{{colors.tertiary.default.hex}}" }
rest            = { fg = "{{colors.outline.default.hex}}" }
desc            = { fg = "{{colors.primary.default.hex}}" }
separator_style = { fg = "{{colors.outline.default.hex}}" }

[confirm]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}", bold = true }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
btn_no  = { fg = "{{colors.on_surface_variant.default.hex}}" }

[spot]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}", bold = true }
tbl_col  = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.success.default.hex}}" }
title_warn  = { fg = "{{colors.warning.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
selected = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }

[help]
border  = { fg = "{{colors.primary.default.hex}}" }
chord   = { fg = "{{colors.tertiary.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }

# Kinds of file keep the preset's hues, taken from the custom colours;
# folders are the seed's primary.
[filetype]
rules = [
	{ mime = "**/image/*", fg = "{{colors.yellow.default.hex}}" },
	{ mime = "**/{audio,video}/*", fg = "{{colors.magenta.default.hex}}" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.red.default.hex}}" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "{{colors.cyan.default.hex}}" },
	{ mime = "vfs/{absent,stale}", fg = "{{colors.outline.default.hex}}" },
	{ url = "*", is = "orphan", fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" },
	{ url = "*", is = "exec", fg = "{{colors.green.default.hex}}" },
	{ url = "*", is = "dummy", fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" },
	{ url = "*/", is = "dummy", fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" },
	{ url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },
]
