# Generated by chromix from a matugen template. Changes are lost on the
# next theme switch.

$m3primary = rgb({{colors.primary.default.hex_stripped}})
$m3secondary = rgb({{colors.secondary.default.hex_stripped}})
$m3tertiary = rgb({{colors.tertiary.default.hex_stripped}})
$m3surface = rgb({{colors.surface.default.hex_stripped}})
$m3onSurface = rgb({{colors.on_surface.default.hex_stripped}})
$m3outline = rgb({{colors.outline.default.hex_stripped}})
$m3outlineVariant = rgb({{colors.outline_variant.default.hex_stripped}})
$m3error = rgb({{colors.error.default.hex_stripped}})
$m3shadow = rgb({{colors.shadow.default.hex_stripped}})

general {
    col.active_border = rgba({{colors.primary.default.hex_stripped}}ee)
    col.inactive_border = rgba({{colors.outline_variant.default.hex_stripped}}aa)
}

decoration {
    shadow {
        color = rgba({{colors.shadow.default.hex_stripped}}ee)
    }
}
