# Generated by chromix from a matugen template. Changes are lost on the
# next theme switch.
#
# eza reads this on every run. Directories take the seed's primary;
# file kinds and git states take the fixed hues, as in yazi and kitty.

colourful: true

filekinds:
  normal: { foreground: "{{colors.on_surface.default.hex}}" }
  directory: { foreground: "{{colors.primary.default.hex}}", is_bold: true }
  symlink: { foreground: "{{colors.cyan.default.hex}}" }
  pipe: { foreground: "{{colors.yellow.default.hex}}" }
  block_device: { foreground: "{{colors.yellow.default.hex}}", is_bold: true }
  char_device: { foreground: "{{colors.yellow.default.hex}}", is_bold: true }
  socket: { foreground: "{{colors.magenta.default.hex}}", is_bold: true }
  special: { foreground: "{{colors.yellow.default.hex}}" }
  executable: { foreground: "{{colors.green.default.hex}}", is_bold: true }
  mount_point: { foreground: "{{colors.primary.default.hex}}", is_bold: true, is_underline: true }

perms:
  user_read: { foreground: "{{colors.yellow.default.hex}}", is_bold: true }
  user_write: { foreground: "{{colors.red.default.hex}}", is_bold: true }
  user_execute_file: { foreground: "{{colors.green.default.hex}}", is_bold: true }
  user_execute_other: { foreground: "{{colors.green.default.hex}}", is_bold: true }
  group_read: { foreground: "{{colors.yellow.default.hex}}" }
  group_write: { foreground: "{{colors.red.default.hex}}" }
  group_execute: { foreground: "{{colors.green.default.hex}}" }
  other_read: { foreground: "{{colors.yellow.default.hex}}" }
  other_write: { foreground: "{{colors.red.default.hex}}" }
  other_execute: { foreground: "{{colors.green.default.hex}}" }
  special_user_file: { foreground: "{{colors.magenta.default.hex}}" }
  special_other: { foreground: "{{colors.magenta.default.hex}}" }
  attribute: { foreground: "{{colors.outline.default.hex}}" }

size:
  major: { foreground: "{{colors.green.default.hex}}", is_bold: true }
  minor: { foreground: "{{colors.green.default.hex}}" }
  number_byte: { foreground: "{{colors.on_surface_variant.default.hex}}" }
  number_kilo: { foreground: "{{colors.green.default.hex}}" }
  number_mega: { foreground: "{{colors.yellow.default.hex}}" }
  number_giga: { foreground: "{{colors.orange.default.hex}}" }
  number_huge: { foreground: "{{colors.red.default.hex}}" }
  unit_byte: { foreground: "{{colors.outline.default.hex}}" }
  unit_kilo: { foreground: "{{colors.outline.default.hex}}" }
  unit_mega: { foreground: "{{colors.outline.default.hex}}" }
  unit_giga: { foreground: "{{colors.outline.default.hex}}" }
  unit_huge: { foreground: "{{colors.outline.default.hex}}" }

users:
  user_you: { foreground: "{{colors.tertiary.default.hex}}" }
  user_root: { foreground: "{{colors.red.default.hex}}", is_bold: true }
  user_other: { foreground: "{{colors.on_surface_variant.default.hex}}" }
  group_yours: { foreground: "{{colors.tertiary.default.hex}}" }
  group_root: { foreground: "{{colors.red.default.hex}}" }
  group_other: { foreground: "{{colors.on_surface_variant.default.hex}}" }

links:
  normal: { foreground: "{{colors.cyan.default.hex}}" }
  multi_link_file: { foreground: "{{colors.on_cyan_container.default.hex}}", background: "{{colors.cyan_container.default.hex}}" }

git:
  new: { foreground: "{{colors.green.default.hex}}" }
  modified: { foreground: "{{colors.yellow.default.hex}}" }
  deleted: { foreground: "{{colors.red.default.hex}}" }
  renamed: { foreground: "{{colors.cyan.default.hex}}" }
  typechange: { foreground: "{{colors.magenta.default.hex}}" }
  ignored: { foreground: "{{colors.outline.default.hex}}" }
  conflicted: { foreground: "{{colors.error.default.hex}}", is_bold: true }

git_repo:
  branch_main: { foreground: "{{colors.primary.default.hex}}" }
  branch_other: { foreground: "{{colors.tertiary.default.hex}}" }
  git_clean: { foreground: "{{colors.green.default.hex}}" }
  git_dirty: { foreground: "{{colors.yellow.default.hex}}" }

security_context:
  colon: { foreground: "{{colors.outline.default.hex}}" }
  user: { foreground: "{{colors.on_surface_variant.default.hex}}" }
  role: { foreground: "{{colors.magenta.default.hex}}" }
  typ: { foreground: "{{colors.cyan.default.hex}}" }
  range: { foreground: "{{colors.magenta.default.hex}}" }

file_type:
  image: { foreground: "{{colors.magenta.default.hex}}" }
  video: { foreground: "{{colors.magenta.default.hex}}", is_bold: true }
  music: { foreground: "{{colors.cyan.default.hex}}" }
  lossless: { foreground: "{{colors.cyan.default.hex}}", is_bold: true }
  crypto: { foreground: "{{colors.green.default.hex}}" }
  document: { foreground: "{{colors.on_surface.default.hex}}" }
  compressed: { foreground: "{{colors.red.default.hex}}" }
  temp: { foreground: "{{colors.outline.default.hex}}" }
  compiled: { foreground: "{{colors.orange.default.hex}}" }
  build: { foreground: "{{colors.yellow.default.hex}}", is_bold: true, is_underline: true }
  source: { foreground: "{{colors.yellow.default.hex}}" }

punctuation: { foreground: "{{colors.outline.default.hex}}" }
date: { foreground: "{{colors.secondary.default.hex}}" }
inode: { foreground: "{{colors.on_surface_variant.default.hex}}" }
blocks: { foreground: "{{colors.on_surface_variant.default.hex}}" }
header: { foreground: "{{colors.on_surface.default.hex}}", is_underline: true }
octal: { foreground: "{{colors.magenta.default.hex}}" }
flags: { foreground: "{{colors.on_surface_variant.default.hex}}" }
symlink_path: { foreground: "{{colors.cyan.default.hex}}" }
control_char: { foreground: "{{colors.error.default.hex}}" }
broken_symlink: { foreground: "{{colors.error.default.hex}}" }
broken_path_overlay: { is_underline: true }
